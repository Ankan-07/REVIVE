[project]
name = "revenue-rescue-engine"
version = "0.1.0"
description = "Revenue Rescue Engine - Autonomous AI Revenue Recovery System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    "langsmith>=0.1.137",
    "langchain-openai>=0.2.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.52.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "httpx>=0.27.2",
    "razorpay>=2.0.1",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "mypy>=1.12.0",
    "ruff>=0.7.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
]
ignore = [
    "E501", # line too long
    "B008", # function call in argument defaults
    "W291", # trailing whitespace
    "W293", # blank line contains whitespace
    "E402", # module level import not at top
    "E711", # comparison to None should be 'if cond is None:' (SQLAlchemy binary expressions)
    "E712", # comparison to True should be 'if cond is True:' (SQLAlchemy binary expressions)
]

