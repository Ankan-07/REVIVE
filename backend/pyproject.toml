[project]
name = "revenue-rescue-engine"
version = "0.1.0"
description = "Revenue Rescue Engine - Autonomous AI Revenue Recovery System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    "langsmith>=0.1.137",
    "langchain-openai>=0.2.2",
    "openai>=1.52.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
