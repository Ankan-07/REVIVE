[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
no_implicit_optional = True
ignore_missing_imports = True

# Enforce strict type checking on schemas, configs, and new components
[mypy-app.schemas.*]
check_untyped_defs = True
disallow_untyped_defs = True

[mypy-app.config]
check_untyped_defs = True

# Legacy untyped modules to be migrated during Phases A-D
[mypy-app.models.*]
ignore_errors = True

[mypy-app.agent.*]
ignore_errors = True

[mypy-app.api.*]
ignore_errors = True

[mypy-app.services.*]
ignore_errors = True

[mypy-app.tools.*]
ignore_errors = True

[mypy-app.simulation.*]
ignore_errors = True

[mypy-app.main]
ignore_errors = True
