# Nginx config for Revenue Rescue Engine (REVIVE)
# Serves the React SPA and reverse-proxies /api/ to the API container.
# TLS termination is expected to be handled by the upstream host/load balancer
# (Render, Railway, Fly, Cloudflare, or a separate nginx + certbot on VPS).

server {
    listen 80;
    server_name _;

    # ── Static assets root ────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    # CSP: allow same-origin scripts/styles; fonts from Google; no iframes.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"
        always;

    # HSTS — only meaningful over TLS; included here so it travels with the config.
    # The host/LB should set this header when terminating TLS upstream.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the API container.
    # The frontend calls /api/cases, /api/healthz, etc. — nginx strips the
    # /api prefix so the API receives /cases, /healthz as normal.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass cookies through (required for revive_session httpOnly cookie)
        proxy_pass_header  Set-Cookie;

        # Timeouts generous enough for agent graph runs (kept sync for now; A4 makes them async)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ── Webhook passthrough ───────────────────────────────────────────────────
    # Razorpay POSTs directly to /webhooks/razorpay.
    # Proxy without stripping so the path reaches the API unchanged.
    location /webhooks/ {
        proxy_pass         http://api:8000/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Raw body must reach the HMAC verifier intact — disable buffering
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # ── Static healthcheck ────────────────────────────────────────────────────
    # Used by the Docker HEALTHCHECK (no need to hit the API container).
    location = /healthz-static {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # Any path not matched above falls back to index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
